<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reservar hora — Imagenda</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #0F6D63;
    --primary-dark: #0B4F48;
    --secondary: #E3A23C;
    --background: #F5F3EE;
    --surface: #ffffff;
    --text-primary: #142420;
    --text-secondary: #52625C;
    --border: #E4E0D6;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--background);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--surface);
    box-shadow: 0 0 24px rgba(20, 36, 32, 0.06);
  }
  header.top {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  header.top .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 999px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
  }
  header.top h1 {
    font-size: 18px;
    margin: 0;
  }
  header.top p {
    margin: 6px 0 0;
    color: var(--text-secondary);
    font-size: 14px;
  }
  main {
    padding: 20px;
  }
  h2.title { font-size: 17px; margin: 0 0 4px; }
  p.subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 18px; }
  .centers {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .centers li + li { margin-top: 8px; }
  .centers a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
  .centers a:hover { border-color: var(--primary); }
  .centers a:active { background: var(--background); }
  .centers a span { color: var(--primary); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .empty, .loading {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 24px 0;
  }
  .banner {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    background: #fef2f2;
    color: #b91c1c;
  }
  h1, h2 { font-family: "Sora", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: -0.2px; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><span class="dot"></span><h1>Imagenda</h1></div>
    <p>Reserva tu hora en línea</p>
  </header>

  <main>
    <h2 class="title">Elige tu centro médico</h2>
    <p class="subtitle">Selecciona dónde quieres reservar tu hora.</p>
    <div id="centers"><div class="loading">Cargando centros…</div></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  // En reservar.imagenda.cl cada centro vive en /<slug>; en cualquier otro
  // host (el backend, localhost), en /reservar/<slug>.
  var onBookingHost = location.hostname.toLowerCase() === "reservar.imagenda.cl";
  var container = document.getElementById("centers");

  function showError(message) {
    var el = document.createElement("div");
    el.className = "banner";
    el.textContent = message;
    container.innerHTML = "";
    container.appendChild(el);
  }

  fetch("/public/booking/clinics")
    .then(function (res) {
      return res.json().then(function (body) { return { ok: res.ok, body: body }; });
    })
    .then(function (result) {
      if (!result.ok) {
        showError(result.body.error || "No fue posible cargar los centros médicos.");
        return;
      }
      var centros = result.body.centros || [];
      if (centros.length === 0) {
        container.innerHTML = '<div class="empty">Por ahora no hay centros con reserva en línea.</div>';
        return;
      }
      var list = document.createElement("ul");
      list.className = "centers";
      centros.forEach(function (c) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = (onBookingHost ? "/" : "/reservar/") + encodeURIComponent(c.slug);
        a.textContent = c.nombre;
        var cta = document.createElement("span");
        cta.textContent = "Reservar →";
        a.appendChild(cta);
        li.appendChild(a);
        list.appendChild(li);
      });
      container.innerHTML = "";
      container.appendChild(list);
    })
    .catch(function () {
      showError("No fue posible conectar con el servidor. Intenta de nuevo.");
    });
})();
</script>
</body>
</html>
